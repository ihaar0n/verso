# Crea el instalador de Windows y lo publica en Releases.
# Se lanza al cambiar la versión en package.json (o a mano desde la pestaña Actions).
name: Crear instalador

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/instalador.yml']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: instalador
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar vulnerabilidades graves
        run: npm audit --audit-level=critical --omit=dev || echo "Revisar npm audit"
      - name: Etiquetar la versión
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" > /dev/null; then
            echo "La etiqueta $V ya existe"
          else
            git tag "$V"
            git push origin "$V"
          fi
      - name: Crear y publicar el instalador
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
