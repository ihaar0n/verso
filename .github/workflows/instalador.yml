# Crea el instalador de Windows y lo publica en Releases.
# Se lanza al cambiar la versión en package.json (o a mano desde la pestaña Actions).
name: Crear instalador

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/instalador.yml']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: instalador
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar vulnerabilidades graves
        run: npm audit --audit-level=critical --omit=dev || echo "Revisar npm audit"
      - name: Crear la versión en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          # Se crea antes de subir los archivos para que no aparezcan dos versiones iguales.
          if gh release view "$V" > /dev/null 2>&1; then
            echo "La versión $V ya existe"
          else
            gh release create "$V" --target "$GITHUB_SHA" --title "Verso ${V#v}" \
              --notes "Descarga **Verso-Setup-${V#v}.exe**, ábrelo e instala. Si Windows avisa, pulsa *Más información → Ejecutar de todas formas*."
          fi
      - name: Crear y publicar el instalador
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ocultar versiones sin instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Si alguna versión publicada quedó sin el .exe (por ejemplo, un duplicado), se pasa a borrador. No se borra nada.
          gh api "repos/${{ github.repository }}/releases?per_page=50" \
            --jq '.[] | select(.draft == false) | [.id, .tag_name, ([.assets[].name | select(endswith(".exe"))] | length)] | @tsv' |
          while read -r id tag exes; do
            if [ "$exes" = "0" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=true > /dev/null && echo "Oculta: $tag ($id)"
            fi
          done
