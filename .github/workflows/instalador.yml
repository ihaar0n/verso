# Crea el instalador de Windows y lo publica en Releases al subir una etiqueta vX.Y.Z.
name: Crear instalador

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar vulnerabilidades graves
        run: npm audit --audit-level=critical --omit=dev || echo "Revisar npm audit"
      - name: Crear y publicar el instalador
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
